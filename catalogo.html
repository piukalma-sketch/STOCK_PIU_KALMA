<style>
  :root{
    --ink:#1A1A1A; --ink-soft:#5C5A56; --paper:#F8F6F2; --paper-dim:#EEEAE3; --card:#FFFFFF;
    --accent:#3A3835; --gold:#B39A73; --line:#DDD8CF; --radius:10px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Work Sans', sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Fraunces', serif; margin:0; letter-spacing:-0.01em;}
  #app{max-width:1080px; margin:0 auto; padding:0 16px 48px;}

  header.top{padding:18px 0 14px; border-bottom:2px solid var(--ink); display:flex; align-items:center; gap:12px;}
  header.top img{height:52px; width:auto; display:block; flex:none;}
  header.top h1{font-size:24px; font-weight:600;}
  header.top .sub{font-size:11px; color:var(--ink-soft); letter-spacing:.07em; text-transform:uppercase; margin-top:2px;}

  .filters{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; padding:16px 0 6px;}
  @media (min-width:640px){ .filters{grid-template-columns:repeat(4,1fr);} }
  .filters label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:4px; font-weight:600;}
  .filters select{width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:8px; font-family:'Work Sans', sans-serif; font-size:15px; background:var(--card); color:var(--ink);}
  .filters select:focus{outline:none; border-color:var(--accent);}
  .bar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:8px 0 4px; min-height:28px;}
  .count{font-size:13px; color:var(--ink-soft);}
  .linkbtn{background:none; border:none; padding:6px 0; font-family:inherit; font-size:13px; color:var(--accent); text-decoration:underline; cursor:pointer;}

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:10px;}
  @media (min-width:640px){ .grid{grid-template-columns:repeat(3,1fr); gap:16px;} }
  @media (min-width:900px){ .grid{grid-template-columns:repeat(4,1fr);} }
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:8px; box-shadow:0 3px 8px rgba(26,26,26,.06); display:flex; flex-direction:column;}
  .ph{position:relative; width:100%; aspect-ratio:1; border-radius:7px; overflow:hidden; background:var(--paper-dim); border:none; padding:0; cursor:pointer; display:block;}
  .ph img{width:100%; height:100%; object-fit:cover; display:block;}
  .ph .empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; font-size:12px; color:var(--ink-soft); padding:8px;}
  .ph .skeleton{position:absolute; inset:0; background:linear-gradient(90deg,var(--paper-dim),#f6f3ee,var(--paper-dim)); background-size:200% 100%; animation:sh 1.2s infinite linear;}
  @keyframes sh{from{background-position:200% 0;} to{background-position:-200% 0;}}
  .badge-more{position:absolute; bottom:6px; right:6px; background:rgba(26,26,26,.78); color:#fff; font-size:11px; padding:2px 8px; border-radius:999px;}
  .card .name{font-weight:600; font-size:14px; margin-top:9px; line-height:1.25;}
  .card .tipo{display:inline-block; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); border:1px solid var(--line); border-radius:999px; padding:1px 8px; margin-top:5px; align-self:flex-start;}
  .price{font-family:'IBM Plex Mono', monospace; font-size:16px; margin-top:5px;}
  .price.na{font-size:13px; color:var(--ink-soft);}
  .chips{display:flex; flex-wrap:wrap; gap:4px; margin-top:7px;}
  .chip{font-size:11.5px; border:1px solid var(--line); border-radius:6px; padding:1px 7px; color:var(--ink-soft); background:var(--paper);}
  .chip.on{background:var(--ink); border-color:var(--ink); color:var(--paper);}

  .msg{text-align:center; color:var(--ink-soft); padding:46px 12px; font-size:15px; line-height:1.5;}
  .more{text-align:center; margin:22px 0 4px;}
  .btn{font-family:inherit; font-size:14px; font-weight:600; background:var(--ink); color:var(--paper); border:none; border-radius:999px; padding:11px 24px; cursor:pointer;}
  .btn.sec{background:transparent; color:var(--ink); border:1px solid var(--ink-soft);}

  #modal{position:fixed; inset:0; z-index:50; background:rgba(26,26,26,.7); display:none; align-items:flex-end; justify-content:center;}
  @media (min-width:640px){ #modal{align-items:center; padding:20px;} }
  .sheet{background:var(--card); width:100%; max-width:520px; max-height:94vh; overflow-y:auto; border-radius:16px 16px 0 0; padding:0 0 18px;}
  @media (min-width:640px){ .sheet{border-radius:14px;} }
  .gal{position:relative;}
  .slides{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
  .slides::-webkit-scrollbar{display:none;}
  .slides .s{flex:0 0 100%; scroll-snap-align:center; aspect-ratio:1; background:var(--paper-dim); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:14px;}
  .slides img{width:100%; height:100%; object-fit:contain; display:block;}
  .nav{position:absolute; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%; border:none; background:rgba(26,26,26,.55); color:#fff; font-size:18px; cursor:pointer; line-height:1;}
  .nav.p{left:8px;} .nav.n{right:8px;}
  .counter{position:absolute; bottom:8px; right:10px; background:rgba(26,26,26,.78); color:#fff; font-size:12px; padding:2px 10px; border-radius:999px;}

    <div><h1>Catálogo</h1><div class="sub">Piu Kalma</div></div>
  </header>

  <div class="filters">
    <div><label for="f-talle">Talle</label><select id="f-talle"><option value="">Todos</option></select></div>
    <div><label for="f-tipo">Tipo</label><select id="f-tipo"><option value="">Todos</option></select></div>
    <div><label for="f-color">Color</label><select id="f-color"><option value="">Todos</option></select></div>
    <div><label for="f-temp">Temporada</label><select id="f-temp"><option value="">Todas</option></select></div>
  </div>
  <div class="bar"><span class="count" id="count"></span><button class="linkbtn" id="clear" type="button" style="display:none;">Quitar filtros</button></div>

  <div id="out"><div class="msg">Cargando catálogo…</div></div>
</div>

<div id="modal" role="dialog" aria-modal="true">
  <div class="sheet" id="sheet"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, getDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Misma configuración pública que index.html (no es secreta: la protección está en firestore.rules).
const firebaseConfig = {
  apiKey: "AIzaSyDQODjJytY4-GT_c9cwVZnda8uatV26J-A",
  authDomain: "stockpiukalma-1ab3d.firebaseapp.com",
  projectId: "stockpiukalma-1ab3d",
  storageBucket: "stockpiukalma-1ab3d.firebasestorage.app",
  messagingSenderId: "501251416330",
  appId: "1:501251416330:web:02d03d9d4c2420b46cdaf3"
};
const db = getFirestore(initializeApp(firebaseConfig));

const $ = (s)=> document.querySelector(s);
const esc = (s)=> String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const collator = new Intl.Collator('es', {sensitivity:'base'});
function compareTalle(a, b){
  const sa = String(a||'').trim(), sb = String(b||'').trim();
  const an = /^\d+$/.test(sa), bn = /^\d+$/.test(sb);
  if(an && bn) return parseInt(sa,10) - parseInt(sb,10);
  if(an) return -1;
  if(bn) return 1;
  return collator.compare(sa, sb);
}
const safeUrl = (u)=> /^(data:image\/|https:\/\/)/.test(u || '') ? u : '';
const money = (n)=> '$ ' + Number(n).toLocaleString('es-AR');

const PAGE = 12;
const state = { talle:'', tipo:'', color:'', temp:'' };
const FIELDS = [['talle','#f-talle'],['tipo','#f-tipo'],['color','#f-color'],['temp','#f-temp']];
const docsCache = new Map();    // talle ('*' = todos) -> lista de modelos
const photoCache = new Map();   // photoId -> Promise<[url]>
let shown = PAGE;
let current = [];               // modelos que se están mostrando con los filtros actuales
let renderToken = 0;

function getPhotos(id){
  if(!photoCache.has(id)){
    photoCache.set(id, Promise.resolve().then(()=> getDoc(doc(db, 'public_photos', id)))
      .then(s => s.exists() ? ((s.data().photos || []).map(p => safeUrl(p && p.url)).filter(Boolean)) : [])
      .catch(()=>{ photoCache.delete(id); return []; }));
  }
  return photoCache.get(id);
}

async function loadDocs(talle){
  const key = talle || '*';
  if(!docsCache.has(key)){
    const src = collection(db, 'public_catalog');
    const snap = await getDocs(talle ? query(src, where('talles', 'array-contains', talle)) : src);
    docsCache.set(key, snap.docs.map(d => Object.assign({id: d.id}, d.data())));
  }
  return docsCache.get(key);
}

function fillSelect(sel, list, current, allLabel){
  const values = list.slice();
  if(current && !values.includes(current)) values.push(current);
  $(sel).innerHTML = `<option value="">${allLabel}</option>` + values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
  $(sel).value = current || '';
}

async function loadFilters(){
  let f = {talles:[], tipos:[], colores:[], temporadas:[]};
  try{
    const s = await getDoc(doc(db, 'public_meta', 'filters'));
    if(s.exists()) f = Object.assign(f, s.data());
  }catch(e){ console.warn('No se pudieron leer los filtros', e); }
  fillSelect('#f-talle', f.talles || [], state.talle, 'Todos');
  fillSelect('#f-tipo', f.tipos || [], state.tipo, 'Todos');
  fillSelect('#f-color', f.colores || [], state.color, 'Todos');
  fillSelect('#f-temp', f.temporadas || [], state.temp, 'Todas');
}

function syncUrl(){
  const p = new URLSearchParams();
  FIELDS.forEach(([k])=>{ if(state[k]) p.set(k, state[k]); });
  const qs = p.toString();
  try{ history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '')); }catch(e){}
}

function cardHtml(d){
  const chips = (d.talles || []).map(t => `<span class="chip${t === state.talle ? ' on' : ''}">${esc(t)}</span>`).join('');
  return `<div class="card" data-id="${esc(d.id)}">
    <button class="ph" type="button" data-open="${esc(d.id)}" aria-label="Ver fotos de ${esc(d.modelo)} ${esc(d.color)}"><div class="skeleton"></div></button>
    <div class="name">${esc(d.modelo)} · ${esc(d.color)}</div>
    ${d.tipo ? `<span class="tipo">${esc(d.tipo)}</span>` : ''}
    ${d.precio != null ? `<div class="price">${esc(money(d.precio))}</div>` : '<div class="price na">Consultar precio</div>'}
    ${chips ? `<div class="chips" title="Talles disponibles">${chips}</div>` : ''}
  </div>`;
}

async function fillPhotos(list, token){
  await Promise.all(list.map(async d=>{
    const urls = await getPhotos(d.photoId);
    if(token !== renderToken) return;
    const box = document.querySelector(`.card[data-id="${CSS.escape(d.id)}"] .ph`);
    if(!box) return;
    box.innerHTML = urls.length
      ? `<img src="${urls[0]}" alt="${esc(d.modelo)} ${esc(d.color)}" loading="lazy">${urls.length > 1 ? `<span class="badge-more">+${urls.length - 1}</span>` : ''}`
      : '<div class="empty">Foto próximamente</div>';
  }));
}

async function render(){
  const token = ++renderToken;
  syncUrl();
  const out = $('#out');
  $('#clear').style.display = (state.talle || state.tipo || state.color || state.temp) ? '' : 'none';
  let docs;
  try{ docs = await loadDocs(state.talle); }
  catch(e){
    console.error(e);
    if(token === renderToken){ $('#count').textContent = ''; out.innerHTML = '<div class="msg">No pudimos cargar el catálogo.<br>Probá de nuevo en un rato.</div>'; }
    return;
  }
  if(token !== renderToken) return;
  current = docs.filter(d =>
    (!state.tipo || d.tipo === state.tipo) &&
    (!state.color || d.color === state.color) &&
    (!state.temp || (d.temporadas || []).includes(state.temp))
  ).sort((a, b)=> collator.compare(a.modelo, b.modelo) || collator.compare(a.color, b.color) || collator.compare(a.tipo || '', b.tipo || ''));

  if(!current.length){
    $('#count').textContent = '';
    out.innerHTML = docsCache.get('*') && !docsCache.get('*').length
      ? '<div class="msg">El catálogo todavía no está disponible.</div>'
      : '<div class="msg">No encontramos modelos con esos filtros.</div>';
    return;
  }
  const visible = current.slice(0, shown);
  $('#count').textContent = `${current.length} ${current.length === 1 ? 'modelo' : 'modelos'}`;
  out.innerHTML = `<div class="grid">${visible.map(cardHtml).join('')}</div>` +
    (current.length > visible.length ? `<div class="more"><button class="btn" id="more" type="button">Ver más (${current.length - visible.length})</button></div>` : '');
  fillPhotos(visible, token);
}

// ---- Eventos ----
FIELDS.forEach(([k, sel])=>{
  $(sel).addEventListener('change', ()=>{ state[k] = $(sel).value; shown = PAGE; render(); });
});
$('#clear').addEventListener('click', ()=>{
  FIELDS.forEach(([k, sel])=>{ state[k] = ''; $(sel).value = ''; });
  shown = PAGE; render();
});
$('#out').addEventListener('click', (e)=>{
  if(e.target.closest('#more')){ shown += PAGE; render(); return; }
  const b = e.target.closest('[data-open]');
  if(b) openModal(b.dataset.open);
});

// ---- Ficha con todas las fotos ----
let modalDoc = null;
async function openModal(id){
  modalDoc = current.find(d => d.id === id);
  if(!modalDoc) return;
  const d = modalDoc;
  const chips = (d.talles || []).map(t => `<span class="chip${t === state.talle ? ' on' : ''}">${esc(t)}</span>`).join('');
  $('#sheet').innerHTML = `
    <button class="x" type="button" id="m-close" aria-label="Cerrar">×</button>
    <div class="gal"><div class="slides" id="m-slides"><div class="s">Cargando fotos…</div></div></div>
    <div class="info">
      <h2>${esc(d.modelo)} · ${esc(d.color)}</h2>
      ${d.tipo ? `<span class="tipo" style="display:inline-block; margin-top:6px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); border:1px solid var(--line); border-radius:999px; padding:1px 8px;">${esc(d.tipo)}</span>` : ''}
      ${d.precio != null ? `<div class="price">${esc(money(d.precio))}</div>` : '<div class="price na">Consultar precio</div>'}
      ${chips ? `<div class="lbl">Talles disponibles</div><div class="chips">${chips}</div>` : ''}
    </div>`;
  $('#modal').style.display = 'flex';
  document.body.style.overflow = 'hidden';
  history.pushState({modal:1}, '');
  const urls = await getPhotos(d.photoId);
  if(modalDoc !== d) return;
  const slides = $('#m-slides');
  if(!slides) return;
  if(!urls.length){ slides.innerHTML = '<div class="s">Foto próximamente</div>'; return; }
  slides.innerHTML = urls.map((u, i)=>`<div class="s"><img src="${u}" alt="${esc(d.modelo)} ${esc(d.color)} (${i + 1})"></div>`).join('');
  if(urls.length > 1){
    const gal = slides.parentElement;
    gal.insertAdjacentHTML('beforeend', `<button class="nav p" type="button" id="m-prev" aria-label="Anterior">‹</button><button class="nav n" type="button" id="m-next" aria-label="Siguiente">›</button><span class="counter" id="m-count">1/${urls.length}</span>`);
    const go = (dir)=>{ slides.scrollBy({left: dir * slides.clientWidth, behavior:'smooth'}); };
    $('#m-prev').addEventListener('click', ()=> go(-1));
    $('#m-next').addEventListener('click', ()=> go(1));
    slides.addEventListener('scroll', ()=>{
      const i = Math.round(slides.scrollLeft / slides.clientWidth);
      const c = $('#m-count'); if(c) c.textContent = `${i + 1}/${urls.length}`;
    }, {passive:true});
  }
}
function closeModal(fromPop){
  if($('#modal').style.display === 'none') return;
  $('#modal').style.display = 'none';
  document.body.style.overflow = '';
  modalDoc = null;
  if(!fromPop && history.state && history.state.modal) history.back();
}
$('#modal').addEventListener('click', (e)=>{ if(e.target.id === 'modal' || e.target.closest('#m-close')) closeModal(); });
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeModal(); });
window.addEventListener('popstate', ()=> closeModal(true)); // el botón "atrás" del celular cierra la ficha

// ---- Inicio: los filtros vienen del link (?talle=2&tipo=...&color=...&temp=...) ----
const q = new URLSearchParams(location.search);
FIELDS.forEach(([k])=>{ state[k] = (q.get(k) || '').trim(); });
loadFilters().then(render);
</script>
